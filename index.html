<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tu Rutina</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icons/icon-512.png">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tu Rutina">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
</head>
<body>

  <header>
    <div class="header-row">
      <div>
        <h1 id="headerTitle">Tu Rutina</h1>
        <p id="headerSub">Creá y seguí tu rutina de gym</p>
      </div>
      <button id="headerInstallBtn" class="header-install-btn" type="button" aria-label="Instalar app">Instalar</button>
    </div>
  </header>

  <div id="page-rutina" class="active">
    <div class="day-tabs" id="dayTabs"></div>
    <div id="routineDays"></div>
  </div>

  <div id="page-prog" class="prog-page"></div>
  <div id="page-log" class="log-page"></div>
  <div id="page-editor" class="editor-page"></div>

  <div id="welcomeModal" class="modal">
    <div class="modal-card">
      <h2>Bienvenido a Tu Rutina</h2>
      <p>Creá tu propia rutina de entrenamiento o empezá con un ejemplo de 5 días.</p>
      <button type="button" class="log-btn" onclick="startBlankRoutine()">Crear desde cero</button>
      <button type="button" class="btn-secondary modal-btn" onclick="startTemplateRoutine()">Usar rutina de ejemplo</button>
    </div>
  </div>

  <div id="installBanner" class="install-banner">
    <div class="install-banner-text">
      <strong>Instalá Tu Rutina</strong>
      <span id="installHint">Acceso directo en tu pantalla de inicio, modo app</span>
    </div>
    <button id="installBtn" class="install-btn" type="button">Instalar</button>
    <button id="installClose" class="install-close" type="button" aria-label="Cerrar">×</button>
  </div>

  <div id="installModal" class="modal">
    <div class="modal-card install-modal-card">
      <button id="installModalClose" class="install-close modal-close" type="button" aria-label="Cerrar">×</button>
      <h2>Instalar Tu Rutina</h2>
      <p>Seguí estos pasos en tu celular:</p>
      <ol id="installSteps" class="install-steps"></ol>
    </div>
  </div>

  <nav>
    <button class="active" data-page="rutina" onclick="showPage('rutina', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="14" y2="13"/></svg>
      Rutina
    </button>
    <button data-page="editor" onclick="showPage('editor', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      Editar
    </button>
    <button data-page="prog" onclick="showPage('prog', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Progresión
    </button>
    <button data-page="log" onclick="showPage('log', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Registro
    </button>
  </nav>

  <script src="js/routine-store.js"></script>
  <script src="js/routine-render.js"></script>
  <script src="js/routine-editor.js"></script>
  <script src="js/log.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
